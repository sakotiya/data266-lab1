# Small copy of config.yaml for smoke-testing the pipeline in ~30 seconds.
# reported: false sends every artifact to outputs/_scratch_smoke/ so a real run's
# reports can never be overwritten.
#   LAB1_CONFIG=task1_llm/shreya/config.smoke.yaml jupyter lab .../task1_char_gpt.ipynb
run: {member: shreya_akotiya, run_name: smoke, reported: false, seed: 1337, device: auto}
data:
  raw_filename: tinystories_raw.txt
  story_separator: "\n\n"
  use_chars: 3_000_000
  member_offset_chars: 0
  val_story_fraction: 0.10
  min_char_freq: 50
  force_core_vocab: true
  normalize_unicode: true
sequences: {seq_len: 128, stride: 128, train_sequences: 1500, val_sequences: 200}
model: {d_model: 128, n_layers: 2, n_heads: 4, d_ff: 512, dropout: 0.1, tie_embeddings: false, attn_bias: false}
train:
  epochs: 2
  batch_size: 32
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_ratio: 0.10
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  log_every: 20
  eval_batches: 5
  spike_sigma: 3.0
generation:
  prompt: "Once upon a time"
  max_new_tokens: 150
  temperatures: [0.8, 1.0]
  top_k: 0
  n_samples_per_setting: 1
  diversity_tokens: 3_000
  diversity_fixed_words: 300
