# Task 1 - GPT-style character-level LM trained from scratch on TinyStories.
# Constraint: no nn.Transformer*, no nn.MultiheadAttention, no fused SDPA.
# Reported run: NVIDIA RTX 4090 (cuda). Nothing below may be hard-coded in the notebook.

run:
  tag: t1_baseline
  member: zoheb_waghu
  seed: 1337
  device: auto          # auto -> cuda > mps > cpu

data:
  # Shared team download of roneneldan/TinyStories (train split), fetched once
  # (see task1_llm/data/README.md).
  pool_path: task1_llm/data/tinystories_raw.txt

  # Spec 1.1 "training (100K) / validation (10K)" read as SEQUENCES, which is the
  # team's agreed reading - so this is ~25.6M training characters, not 100K.
  train_sequences: 100000
  val_sequences: 10000
  block_size: 256       # context length; targets are inputs shifted right by 1
  stride: 256           # == block_size, so windows are non-overlapping

  # "Each member creates their own split": shreya_akotiya reads chars [0, 34M);
  # my slice starts after theirs ends, so the two splits are disjoint.
  member_offset_chars: 34000000

  # char_to_idx is built from the training split only.
  cache_dir: task1_llm/zoheb_waghu/data_processed

model:
  n_layer: 4
  n_head: 4
  n_embd: 256           # must be divisible by n_head
  dropout: 0.1             # token AND position embeddings are both learned
  tie_weights: false
  bias: true

train:
  epochs: 10            # spec minimum is 10
  # With 100K training sequences an epoch is a real pass over the data:
  # 100000 / 32 = 3125 optimiser steps per epoch, 31250 total. The
  # steps_per_epoch override the 100K-character version needed is gone.
  batch_size: 32           # optimiser: AdamW
  lr: 3.0e-4
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 1000   # ~1/3 of one epoch
  schedule: cosine
  log_interval_steps: 100   # validation runs once per epoch

generate:
  prompts: ["Once upon a time", "The little girl", "Tom and Jane went"]
  max_new_tokens: 400
  strategies:
    - {name: greedy}
    - {name: temperature, temperature: 0.8}
    - {name: temperature, temperature: 1.2}

eval:
  ngram_max: 3          # distinct-1/2/3
  repeat_ngram_n: 4     # repeated 4-gram rate
  # A causal-mask probe always runs: perturb token j, assert logits i<j unchanged.

paths:
  # Raw logs live in the team-wide evidence trail, not inside the member folder.
  log_dir: reproducibility/raw_logs/zoheb_waghu/task1_llm
  checkpoint_dir: task1_llm/zoheb_waghu/checkpoints
  output_dir: task1_llm/zoheb_waghu/outputs   # plots.py writes to outputs/plots/
  sample_dir: task1_llm/zoheb_waghu/outputs/samples
  metrics_csv_path: task1_llm/zoheb_waghu/metrics_report.csv
  extended_metrics_csv_path: task1_llm/zoheb_waghu/metrics_report_extended.csv
