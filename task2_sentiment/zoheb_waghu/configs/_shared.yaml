# Shared preprocessing + evaluation protocol for all three of my Task 2 models.
# Kept in one file so the three models differ ONLY where I intend them to differ,
# and so my numbers stay comparable with my teammates' (workplan section 0).

run:
  member: zoheb_waghu
  seed: 1337
  device: auto          # portable: cuda on the GPU Lab, mps locally

data:
  dataset: yelp_polarity   # confirmed: Yelp polarity
  train_size: 100000       # subsample of the 560K train split; set null for full
  val_fraction: 0.1        # held out of TRAIN. Official test split is touched once, at the end.
  test_size: null          # null = full 38K test split
  cache_dir: task2_sentiment/zoheb_waghu/data_processed

preprocess:
  lowercase: true
  strip_punctuation: true
  strip_special_chars: true
  # Stopwords: NLTK English MINUS negations - not/no/never/n't invert sentiment,
  # so they are kept. No _NEG marking. Lemmatize, never stem.
  normalize_contractions: true              # "don't" -> "do not" BEFORE stopword removal
  lemmatize: true
  min_token_freq: 2
  max_vocab: 30000
  max_len: 256                              # <pad> = 0, <unk> = 1

embedding:
  # HARD CONSTRAINT: learned from scratch, trainable, no pretrained embeddings or LMs.
  dim: 128

eval:
  bootstrap_samples: 2000     # 95% CI for accuracy, macro-F1, MCC
  calibration_bins: 15        # expected calibration error
  # Paired McNemar: baseline vs each experimental model.
  slices:                     # per-slice macro-F1 and error rate (robustness); rules in data.compute_slices
    - {name: short_reviews}       # len_tokens <= 50
    - {name: long_reviews}        # len_tokens > 200
    - {name: contains_negation}   # not / no / never / n't in the raw review
    - {name: high_punctuation}    # 3+ exclamation marks

paths:
  # Raw logs live in the team-wide evidence trail, not inside the member folder.
  log_dir: reproducibility/raw_logs/zoheb_waghu/task2_sentiment
  checkpoint_dir: task2_sentiment/zoheb_waghu/checkpoints
  output_dir: task2_sentiment/zoheb_waghu/outputs
  plot_dir: task2_sentiment/zoheb_waghu/outputs/plots
  confusion_dir: task2_sentiment/zoheb_waghu/outputs/confusion_matrices
  metrics_csv_path: task2_sentiment/zoheb_waghu/metrics_report.csv
  extended_metrics_csv_path: task2_sentiment/zoheb_waghu/metrics_report_extended.csv
