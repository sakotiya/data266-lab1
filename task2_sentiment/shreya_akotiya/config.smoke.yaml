# Small copy of config.yaml for smoke-testing the pipeline quickly.
#   LAB1_CONFIG=task2_sentiment/shreya/config.smoke.yaml jupyter lab .../task2_sentiment.ipynb
run: {member: shreya_akotiya, run_name: smoke, seed: 1337, device: auto}
data: {train_csv: train.csv, test_csv: test.csv, n_train: 20000, n_val: 2000, n_test: 5000}
preprocess:
  lowercase: true
  strip_punctuation: true
  remove_stopwords: true
  keep_negations: true
  stem: true
  min_word_freq: 2
  max_vocab: 20000
  max_len: 100
train: {epochs: 2, batch_size: 128, lr: 1.0e-3, weight_decay: 0.0, grad_clip: 1.0}
models:
  baseline_meanpool: {type: meanpool, emb_dim: 64, dropout: 0.3}
  exp_textcnn: {type: textcnn, emb_dim: 64, n_filters: 50, kernel_sizes: [3, 4, 5], dropout: 0.5}
  exp_bilstm: {type: bilstm, emb_dim: 64, hidden: 64, n_layers: 1, dropout: 0.3}
eval: {bootstrap_samples: 200, ece_bins: 10, n_errors_per_bucket: 5}
