# Task 3 - CycleGAN, photo <-> Monet (Kaggle gan-getting-started).
# Member: shreya_akotiya
# Domain A = photo (7038 imgs), Domain B = monet (300 imgs), unpaired.
#
# Values below are the ones the submitted run (run 1, t3_shreya_unet_128_20261002_023102) trained
# with: UNet generator (instead of zoheb_waghu's ResNet), 3-layer PatchGAN, 256px, 80 epochs.

run:
  tag: t3_shreya_unet_128   # kept: the run ID and all its files use this tag (the run itself is 256px)
  member: shreya_akotiya
  seed: 42
  device: auto          # auto | cuda | mps | cpu

data:
  domain_a_dir: task3_gan/data/photo_jpg
  domain_b_dir: task3_gan/data/monet_jpg
  image_size: 256          # native resolution of the dataset
  load_size: 286           # resize then random-crop to image_size
  random_flip: true
  num_workers: 4
  epoch_definition: domain_a   # 7038 photos = one epoch

model:
  # Generator: UNet with skip connections (vs zoheb's ResNet)
  generator: unet
  gen_down_blocks: 7       # encoder depth (256 -> 2x2 bottleneck)
  gen_filters: 64
  gen_use_dropout: true

  # Discriminator: PatchGAN, 31x31 output on 256px (about 46x46 px per score)
  discriminator: patchgan
  disc_layers: 3
  disc_filters: 64
  norm: instance
  init: normal
  init_gain: 0.02

loss:
  gan_mode: lsgan
  lambda_cycle_a: 10.0
  lambda_cycle_b: 10.0
  lambda_identity: 0.5     # scaled by lambda_cycle
  image_pool_size: 50

train:
  epochs: 80               # fits one Colab session on an A100 (~9.7 h)
  epochs_decay: 20         # constant LR, then linear decay over the last 20 epochs
  batch_size: 1
  optimizer: adam
  lr: 2.0e-4
  betas: [0.5, 0.999]
  log_interval_steps: 50
  sample_interval_steps: 500
  checkpoint_interval_epochs: 10
  amp: false

eval:
  fid_batch_size: 32
  kid_subset_size: 100
  lpips_net: alex
  cycle_l1_samples: 200
  content_cosine_backbone: inception_v3
  human_audit:
    n_samples: 30
    n_raters: 2
    blind: true
    axes: [style, content, artifacts]

submission:
  direction: photo_to_monet
  n_images: 7038
  format: zip
  out_dir: task3_gan/shreya_akotiya/outputs/pred_A2B

paths:
  log_dir: reproducibility/raw_logs/shreya_akotiya/task3_gan
  checkpoint_dir: task3_gan/shreya_akotiya/checkpoints
  output_dir: task3_gan/shreya_akotiya/outputs
  metrics_csv_path: task3_gan/shreya_akotiya/full_metrics_report.csv
